name: Deploy OCI - Quero Ler Backend

on:
  push:
    branches:
      - 'main'
      - 'develop'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get first tag
        id: tag
        run: |
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          echo "tag=$FIRST_TAG" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (${{ matrix.target }})
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(github.ref_name == 'main' && '["production"]' || '["staging", "tst"]') }}
    environment: ${{ matrix.target }}

    env:
      TF_WORKSPACE: queroler-backend-${{ matrix.target }}
      DB_NAME: ${{ matrix.target == 'production' && 'db_quero_ler_v2' || format('db_quero_ler_{0}', matrix.target) }}
      TF_VAR_name: ${{ vars.TF_VAR_NAME }}-${{ matrix.target }}
      TF_VAR_how_many_nodes: ${{ matrix.target == 'production' && vars.TF_VAR_PROD_NODES || vars.TF_VAR_DEV_NODES }}
      TF_VAR_availability_domain: ${{ vars.TF_VAR_AVAILABILITY_DOMAIN }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_CLOUD_TOKEN }}

      # OCI credentials (shared across all terraform steps)
      TF_VAR_user_ocid: ${{ secrets.TF_VAR_USER_OCID }}
      TF_VAR_fingerprint: ${{ secrets.TF_VAR_FINGERPRINT }}
      TF_VAR_tenancy_ocid: ${{ secrets.TF_VAR_TENANCY_OCID }}
      TF_VAR_region: ${{ secrets.TF_VAR_REGION }}
      TF_VAR_private_key: ${{ secrets.OCI_TF_PRIVATE_KEY }}

    steps:
      # ==========================================
      # Terraform - Infrastructure Provisioning
      # ==========================================
      - name: Checkout Terraform Project
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.TF_REPO_OWNER }}/${{ secrets.TF_REPO_NAME }}
          token: ${{ secrets.PAT_TOKEN }}
          path: terraform-infra

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure OCI Credentials
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_TF_PRIVATE_KEY }}" > ~/.oci/oci_tf_private_key.pem
          chmod 600 ~/.oci/oci_tf_private_key.pem

      - name: Terraform Init
        working-directory: terraform-infra
        run: terraform init -input=false

      - name: Terraform Plan (Staging / Production)
        if: matrix.target != 'tst'
        working-directory: terraform-infra
        run: terraform plan -input=false

      - name: Terraform Plan (Tst - shared VCN)
        if: matrix.target == 'tst'
        working-directory: terraform-infra
        run: |
          VCN_ID=$(TF_WORKSPACE=queroler-backend-staging terraform output -raw vcn_id)
          COMP_ID=$(TF_WORKSPACE=queroler-backend-staging terraform output -raw compartment_id)
          echo "VCN_ID=$VCN_ID" >> $GITHUB_ENV
          echo "COMP_ID=$COMP_ID" >> $GITHUB_ENV
          terraform plan -input=false \
            -var="create_network=false" \
            -var="vcn_id=$VCN_ID" \
            -var="vcn_compartment_id=$COMP_ID" \
            -var="subnet_cidr=10.0.1.0/24"

      - name: Terraform Apply (Staging / Production)
        if: matrix.target != 'tst'
        working-directory: terraform-infra
        run: terraform apply -auto-approve -input=false

      - name: Terraform Apply (Tst - shared VCN)
        if: matrix.target == 'tst'
        working-directory: terraform-infra
        run: |
          terraform apply -auto-approve -input=false \
            -var="create_network=false" \
            -var="vcn_id=$VCN_ID" \
            -var="vcn_compartment_id=$COMP_ID" \
            -var="subnet_cidr=10.0.1.0/24"

      - name: Get Instance IP
        id: instance_ip
        working-directory: terraform-infra
        run: |
          IP=$(terraform output -raw ssh-with-ubuntu-user | grep -oP '\d+\.\d+\.\d+\.\d+' | head -1)
          echo "public_ip=$IP" >> $GITHUB_OUTPUT

      - name: Get SSH Key
        id: ssh_key
        working-directory: terraform-infra
        run: |
          SSH_KEY=$(terraform output -raw ssh_private_key_b64)
          echo "ssh_key=$SSH_KEY" >> $GITHUB_OUTPUT

      - name: Wait for SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "Waiting for SSH to be available..."
          for i in {1..30}; do
            ssh-keyscan -H ${{ steps.instance_ip.outputs.public_ip }} >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 10
          done

      # ==========================================
      # Application Deployment via SSH
      # ==========================================
      - name: Decode SSH Key
        id: decode_key
        run: |
          DECODED=$(echo '${{ steps.ssh_key.outputs.ssh_key }}' | base64 -d)
          {
            echo "ssh_key<<ENDOFKEY"
            echo "$DECODED"
            echo "ENDOFKEY"
          } >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.instance_ip.outputs.public_ip }}
          username: ubuntu
          key: ${{ steps.decode_key.outputs.ssh_key }}
          script: |
            sudo docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

            sudo iptables -P FORWARD ACCEPT
            sudo systemctl restart docker

            # Cleanup any existing containers and volumes
            sudo docker rm -f postgres-queroler-${{ matrix.target }} 2>/dev/null || true
            sudo docker rm -f api-queroler-${{ matrix.target }} 2>/dev/null || true
            mkdir -p ~/queroler-deploy-${{ matrix.target }}
            cd ~/queroler-deploy-${{ matrix.target }}

            cat > docker-compose.yml << 'EOF'
            services:
              db:
                image: postgres:17
                container_name: postgres-queroler-${{ matrix.target }}
                environment:
                  POSTGRES_DB: ${{ env.DB_NAME }}
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: ${{ matrix.target == 'production' && secrets.DB_PASSWORD_PROD || (matrix.target == 'staging' && secrets.DB_PASSWORD_DEV || secrets.DB_PASSWORD_TST) }}
                ports:
                  - "5432:5432"
                volumes:
                  - postgres_data_${{ matrix.target }}:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U postgres -d ${{ env.DB_NAME }}"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              api:
                image: ${{ needs.build-and-push.outputs.image_tag }}
                container_name: api-queroler-${{ matrix.target }}
                ports:
                  - "8080:8080"
                depends_on:
                  db:
                    condition: service_healthy
                environment:
                  - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${{ env.DB_NAME }}
                  - SPRING_DATASOURCE_USERNAME=postgres
                  - SPRING_DATASOURCE_PASSWORD=${{ matrix.target == 'production' && secrets.DB_PASSWORD_PROD || (matrix.target == 'staging' && secrets.DB_PASSWORD_DEV || secrets.DB_PASSWORD_TST) }}
                  - SPRING_JPA_HIBERNATE_DDL_AUTO=update
                  - SPRING_PROFILES_ACTIVE=${{ matrix.target == 'production' && 'prod' || 'dev' }}
                  - API_SECURITY_TOKEN_SECRET=${{ secrets.API_SECURITY_TOKEN_SECRET }}

            volumes:
              postgres_data_${{ matrix.target }}:
            EOF

            sudo docker compose pull
            sudo docker compose up -d || (sudo docker logs postgres-queroler-${{ matrix.target }} && exit 1)
            sudo docker image prune -f

      - name: Show Deployment URL
        run: |
          IP="${{ steps.instance_ip.outputs.public_ip }}"
          echo "## Deploy concluído!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Ambiente | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| **${{ matrix.target }}** | http://$IP:8080 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Swagger: http://$IP:8080/swagger-ui/index.html" >> $GITHUB_STEP_SUMMARY
