spring:
  application:
    name: QueroLerVersao02
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_quero_ler_v2}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    clean-disabled: false
    baseline-on-migrate: false

    locations: classpath:db/migration

api:
  security:
    token:
      secret: ${API_SECURITY_TOKEN_SECRET:quero-ler-secret-local-com-32-char!}
      issuer: quero_ler
      expiration-minutes: 120

server:
  tomcat:
    max-swallow-size: -1